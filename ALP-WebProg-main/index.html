<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epic Game Encyclopedia</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        body {
            background-color: #121212; 
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .btn-tambah {
            background-color: #ffa500; 
            color: black;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }
        .game-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .card {
            background-color: #242424;
            padding: 15px;
            border-radius: 10px;
            width: 220px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .genre {
            color: #ffa500;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .action-buttons {
            display: flex;
            justify-content: space-between;
        }
        .btn-edit {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 45%;
        }
        .btn-hapus {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 45%;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Epic Game Encyclopedia</h1>
        <a href="#" class="btn-tambah">+ Tambah Game Baru</a>
    </div>

    <div class="game-container">

 
        <div class="card">
            <img src="img/CoD.jpg" alt="Call of Duty Mobile">
            <h3>Call of Duty: Mobile</h3>
            <p class="genre">Tactical Shooter</p>
            <div class="action-buttons">
                <button class="btn-edit">Edit</button>
                <button class="btn-hapus">Hapus</button>
            </div>
        </div>

 
        <div class="card">
            <img src="img/RE4.jpg" alt="Resident Evil 4">
            <h3>Resident Evil 4</h3>
            <p class="genre">Survival Horror</p>
            <div class="action-buttons">
                <button class="btn-edit">Edit</button>
                <button class="btn-hapus">Hapus</button>
            </div>
        </div>

        <div class="card">
            <img src="img/MHW.jpg" alt="Monster Hunter World">
            <h3>Monster Hunter: World</h3>
            <p class="genre">Action RPG</p>
            <div class="action-buttons">
                <button class="btn-edit">Edit</button>
                <button class="btn-hapus">Hapus</button>
            </div>
        </div>

       
        <div class="card">
            <img src="img/Ms.jpg" alt="Metal Slug">
            <h3>Metal Slug</h3>
            <p class="genre">Arcade Shooter</p>
            <div class="action-buttons">
                <button class="btn-edit">Edit</button>
                <button class="btn-hapus">Hapus</button>
            </div>
        </div>

       
        <div class="card">
            <img src="img/PUBG.jpg" alt="PUBG Mobile">
            <h3>PUBG Mobile</h3>
            <p class="genre">Survival Sandbox</p>
            <div class="action-buttons">
                <button class="btn-edit">Edit</button>
                <button class="btn-hapus">Hapus</button>
            </div>
        </div>

    </div>

</body>
</html>
